<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBY AI</title>
  <link rel="icon" href="/static/images/logo_3.png" type="image/x-icon">
  <style>
    :root {
      --light-main: rgba(74, 194, 210, 0.38);
      --light-soft: rgba(118, 220, 176, 0.18);
      --text: #f6fbfc;
      --muted: #aebcc1;
      --panel: rgba(5, 8, 10, 0.58);
      --line: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      isolation: isolate;
      background:
        linear-gradient(120deg, rgba(2, 5, 8, 0.96), rgba(6, 10, 14, 0.88)),
        url("/static/my_bg.jpg") center / cover fixed,
        #05080a;
      transition: background-color 0.6s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0%, var(--light-soft) 48%, transparent 100%),
        linear-gradient(180deg, transparent 0%, var(--light-main) 52%, transparent 100%);
      opacity: 0.72;
      transform: scale(1.05);
      filter: blur(42px);
      z-index: 0;
      transition: opacity 0.7s ease, filter 0.7s ease, background 0.7s ease;
    }

    body.speaking::before {
      animation: speakingLight 1.2s ease-in-out infinite;
    }

    body.user-light {
      --light-main: rgba(92, 144, 255, 0.36);
      --light-soft: rgba(82, 190, 230, 0.18);
    }

    body.rain-light {
      --light-main: rgba(72, 196, 222, 0.50);
      --light-soft: rgba(92, 128, 255, 0.18);
    }

    body.heat-light {
      --light-main: rgba(246, 172, 69, 0.50);
      --light-soft: rgba(255, 105, 84, 0.20);
    }

    body.clear-light {
      --light-main: rgba(103, 217, 128, 0.36);
      --light-soft: rgba(74, 194, 210, 0.14);
    }

    body.alert-light {
      --light-main: rgba(255, 96, 76, 0.50);
      --light-soft: rgba(246, 172, 69, 0.20);
    }

    @keyframes speakingLight {
      0%, 100% { opacity: 0.48; filter: blur(48px); }
      50% { opacity: 0.92; filter: blur(30px); }
    }

    .robot-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      opacity: 0.82;
    }

    .robot-backdrop::before {
      content: "";
      position: absolute;
      inset: 8vh 8vw 14vh;
      background:
        linear-gradient(90deg, transparent 0 48%, rgba(255,255,255,0.05) 48% 52%, transparent 52%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 56px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 56px);
      mask-image: radial-gradient(ellipse at center, black 0 56%, transparent 78%);
      opacity: 0.56;
    }

    .robot-frame {
      position: relative;
      width: min(760px, 78vw);
      height: min(760px, 72vh);
      display: grid;
      place-items: center;
    }

    .robot-frame::before,
    .robot-frame::after {
      content: "";
      position: absolute;
      top: 16%;
      width: 18%;
      height: 42%;
      border: 1px solid color-mix(in srgb, var(--light-main), transparent 35%);
      opacity: 0.42;
    }

    .robot-frame::before {
      left: 2%;
      border-right: 0;
      transform: skewY(-8deg);
    }

    .robot-frame::after {
      right: 2%;
      border-left: 0;
      transform: skewY(8deg);
    }

    .robot-head {
      position: relative;
      width: 68%;
      aspect-ratio: 1.22;
      border: 2px solid color-mix(in srgb, var(--light-main), white 16%);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.02)),
        linear-gradient(90deg, transparent 0 12%, rgba(255,255,255,0.04) 12% 13%, transparent 13% 87%, rgba(255,255,255,0.04) 87% 88%, transparent 88%);
      box-shadow:
        0 0 34px color-mix(in srgb, var(--light-main), transparent 56%),
        inset 0 0 28px rgba(255,255,255,0.06);
      transform: translateY(-32px);
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }

    .robot-arm {
      position: absolute;
      top: 48%;
      width: 34%;
      height: 22%;
      opacity: 0.58;
      transition: transform 0.7s ease, opacity 0.7s ease;
    }

    .robot-arm.left {
      left: -2%;
      transform: rotate(14deg);
      transform-origin: right center;
    }

    .robot-arm.right {
      right: -2%;
      transform: rotate(-14deg) scaleX(-1);
      transform-origin: right center;
    }

    .upper-arm,
    .forearm {
      position: absolute;
      height: 12px;
      border: 1px solid color-mix(in srgb, var(--light-main), white 14%);
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--light-main), transparent 18%), transparent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 34%);
    }

    .upper-arm {
      top: 18%;
      right: 20%;
      width: 58%;
      transform: rotate(-20deg);
    }

    .forearm {
      top: 42%;
      left: 16%;
      width: 56%;
      transform: rotate(22deg);
    }

    .joint,
    .claw {
      position: absolute;
      border: 1px solid color-mix(in srgb, var(--light-main), white 18%);
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 28%);
    }

    .joint {
      top: 31%;
      left: 56%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    .claw {
      top: 54%;
      left: 6%;
      width: 34px;
      height: 22px;
      border-left: 0;
      border-radius: 0 999px 999px 0;
    }

    body.has-updates .robot-arm.left {
      opacity: 0.82;
      transform: rotate(30deg) translateY(-18px);
    }

    body.has-updates .robot-arm.right {
      opacity: 0.86;
      transform: rotate(-32deg) scaleX(-1) translateY(-22px);
    }

    body.speaking .robot-arm {
      opacity: 0.9;
      animation: armPulse 1.4s ease-in-out infinite;
    }

    .robot-head::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 2px;
      height: 52px;
      background: color-mix(in srgb, var(--light-main), white 12%);
      box-shadow: 0 0 16px var(--light-main);
      transform: translateX(-50%);
    }

    .robot-head::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 48px);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--light-main), white 12%);
      box-shadow: 0 0 24px var(--light-main);
      transform: translateX(-50%);
    }

    .robot-eye {
      position: absolute;
      top: 33%;
      width: 18%;
      height: 12%;
      border-radius: 999px;
      background: color-mix(in srgb, var(--light-main), white 18%);
      box-shadow: 0 0 22px var(--light-main);
      opacity: 0.88;
    }

    .robot-eye.left { left: 22%; }
    .robot-eye.right { right: 22%; }

    .robot-mouth {
      position: absolute;
      left: 21%;
      right: 21%;
      bottom: 26%;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-top: 1px solid rgba(255,255,255,0.12);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .wave-bar {
      width: 5px;
      height: 16px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--light-main), white 12%);
      box-shadow: 0 0 14px var(--light-main);
      opacity: 0.76;
      transform-origin: center;
    }

    .wave-bar:nth-child(2) { height: 28px; }
    .wave-bar:nth-child(3) { height: 40px; }
    .wave-bar:nth-child(4) { height: 24px; }
    .wave-bar:nth-child(5) { height: 34px; }
    .wave-bar:nth-child(6) { height: 20px; }
    .wave-bar:nth-child(7) { height: 38px; }
    .wave-bar:nth-child(8) { height: 26px; }
    .wave-bar:nth-child(9) { height: 14px; }

    .wave-field {
      position: absolute;
      inset: 6% 0 18%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wave-stack {
      width: 22%;
      display: grid;
      gap: 14px;
      opacity: 0.54;
    }

    .wave-stack.right { transform: scaleX(-1); }

    .wave-line {
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--light-main), transparent);
      box-shadow: 0 0 16px var(--light-main);
      transform-origin: center;
    }

    .wave-line:nth-child(1) { width: 52%; margin-left: 40%; }
    .wave-line:nth-child(2) { width: 78%; margin-left: 18%; }
    .wave-line:nth-child(3) { width: 100%; }
    .wave-line:nth-child(4) { width: 72%; margin-left: 24%; }
    .wave-line:nth-child(5) { width: 48%; margin-left: 44%; }

    body.speaking .robot-head {
      box-shadow:
        0 0 54px color-mix(in srgb, var(--light-main), transparent 30%),
        inset 0 0 34px rgba(255,255,255,0.08);
    }

    body.speaking .wave-bar {
      animation: voiceBars 0.76s ease-in-out infinite;
    }

    body.speaking .wave-bar:nth-child(2n) {
      animation-delay: 0.12s;
    }

    body.speaking .wave-bar:nth-child(3n) {
      animation-delay: 0.22s;
    }

    body.speaking .wave-line {
      animation: sideWave 1.1s ease-in-out infinite;
    }

    body.speaking .wave-line:nth-child(2n) {
      animation-delay: 0.16s;
    }

    @keyframes voiceBars {
      0%, 100% { transform: scaleY(0.56); opacity: 0.48; }
      50% { transform: scaleY(1.35); opacity: 1; }
    }

    @keyframes sideWave {
      0%, 100% { transform: scaleX(0.72); opacity: 0.34; }
      50% { transform: scaleX(1.08); opacity: 0.92; }
    }

    @keyframes armPulse {
      0%, 100% { filter: drop-shadow(0 0 4px var(--light-main)); }
      50% { filter: drop-shadow(0 0 18px var(--light-main)); }
    }

    .menu {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 4;
    }

    .menu-toggle {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.32);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .toggle_img {
      width: 28px;
      height: 28px;
    }

    .options {
      display: none;
      position: absolute;
      top: 52px;
      left: 0;
      min-width: 150px;
      margin: 0;
      padding: 6px;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(5, 8, 10, 0.88);
    }

    .options.show { display: block; }

    .options a {
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }

    .options a:hover { background: rgba(255, 255, 255, 0.08); }

    .center {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 22px;
      text-align: center;
      padding: 24px;
    }

    .title {
      margin: 0;
      font-size: clamp(72px, 16vw, 180px);
      line-height: 0.86;
      font-weight: 900;
      letter-spacing: 0;
      color: rgba(246, 251, 252, 0.94);
      text-shadow: 0 0 26px rgba(100, 220, 230, 0.32);
      transition: text-shadow 0.5s ease, transform 0.5s ease;
    }

    body.speaking .title {
      transform: scale(1.018);
      text-shadow: 0 0 42px var(--light-main);
    }

    .start-btn {
      min-width: 180px;
      height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .start-btn:hover { background: rgba(255, 255, 255, 0.14); }

    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 3;
      width: min(1120px, calc(100vw - 32px));
      transform: translateX(-50%);
    }

    .caption {
      min-height: 72px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      color: var(--text);
      line-height: 1.45;
      font-size: clamp(16px, 1.25vw, 20px);
      overflow-wrap: anywhere;
    }

    .composer {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 82px;
      gap: 8px;
    }

    #textInput {
      height: 46px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.34);
      color: var(--text);
      font-size: 15px;
      padding: 0 12px;
      outline: none;
      backdrop-filter: blur(12px);
    }

    #textInput:focus {
      border-color: color-mix(in srgb, var(--light-main), white 22%);
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 44%);
    }

    #sendButton {
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .updates-panel {
      position: absolute;
      inset: -5% -38% 0;
      z-index: 5;
      pointer-events: none;
    }

    .updates-panel[hidden] { display: none; }

    .updates-title { display: none; }

    .updates-list {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .updates-list li {
      position: absolute;
      width: clamp(230px, 15vw, 290px);
      height: clamp(118px, 12vh, 142px);
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      background: rgba(5, 8, 10, 0.66);
      backdrop-filter: blur(14px);
      color: var(--text);
      font-size: clamp(15px, 1vw, 17px);
      line-height: 1.36;
      overflow-wrap: anywhere;
      overflow: hidden;
      box-shadow: 0 0 22px color-mix(in srgb, var(--light-main), transparent 66%);
      animation: updateFloat 2.8s ease-in-out infinite;
    }

    .updates-list li:nth-child(1) { left: 1%; top: 10%; }
    .updates-list li:nth-child(2) { right: 1%; top: 10%; }
    .updates-list li:nth-child(3) { left: 1%; top: 43%; }
    .updates-list li:nth-child(4) { right: 1%; top: 43%; }
    .updates-list li:nth-child(5) { left: 1%; top: 68%; }
    .updates-list li:nth-child(6) { right: 1%; top: 68%; }

    .updates-list li:nth-child(2n) {
      animation-delay: 0.3s;
    }

    .updates-list strong {
      display: block;
      margin-bottom: 6px;
      color: color-mix(in srgb, var(--light-main), white 30%);
      font-size: 12px;
      text-transform: uppercase;
    }

    .updates-list span {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow: hidden;
    }

    @keyframes updateFloat {
      0%, 100% { transform: translateY(0); opacity: 0.76; }
      50% { transform: translateY(-5px); opacity: 1; }
    }

    .status {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 3;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      .caption {
        min-height: 76px;
      }
      .updates-panel {
        inset: 0 -8% 0;
      }
      .updates-list li {
        width: min(210px, 43vw);
        height: auto;
        min-height: 74px;
        max-height: 126px;
        padding: 10px 11px;
        font-size: 14px;
      }
      .updates-list strong { font-size: 11.5px; }
      .updates-list span { -webkit-line-clamp: 3; }
      .updates-list li:nth-child(1) { left: 2%; top: 5%; }
      .updates-list li:nth-child(2) { right: 2%; top: 5%; }
      .updates-list li:nth-child(3),
      .updates-list li:nth-child(4) { width: min(190px, 40vw); }
      .updates-list li:nth-child(3) { left: -4%; top: 62%; }
      .updates-list li:nth-child(4) { right: -4%; top: 62%; }
      .updates-list li:nth-child(n+5) { display: none; }
      .robot-arm {
        opacity: 0.38;
      }
    }
  </style>
</head>
<body class="clear-light">
  <div class="menu">
    <button class="menu-toggle" onclick="toggleMenuByImage(event)" aria-label="Menu">
      <img class="toggle_img" src="/static/images/grey_toggle_icon1.png" alt="">
    </button>
    <ul class="options" id="optionsMenu">
      <li><a href="user_manual">User Manual</a></li>
      <li><a href="about">About</a></li>
      <li><a href="troubleshoot">Troubleshoot</a></li>
    </ul>
  </div>

  <div class="status" id="runState">Standby</div>

  <div class="robot-backdrop">
    <div class="wave-field">
      <div class="wave-stack">
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
      </div>
      <div class="wave-stack right">
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
        <span class="wave-line"></span>
      </div>
    </div>
    <div class="robot-frame">
      <div class="robot-arm left">
        <span class="upper-arm"></span>
        <span class="joint"></span>
        <span class="forearm"></span>
        <span class="claw"></span>
      </div>
      <div class="robot-arm right">
        <span class="upper-arm"></span>
        <span class="joint"></span>
        <span class="forearm"></span>
        <span class="claw"></span>
      </div>
      <section class="updates-panel" id="updatesPanel" hidden>
        <h2 class="updates-title">Daily Updates</h2>
        <ul class="updates-list" id="updatesList"></ul>
      </section>
      <div class="robot-head">
        <span class="robot-eye left"></span>
        <span class="robot-eye right"></span>
        <div class="robot-mouth">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>
      </div>
    </div>
  </div>

  <main class="center">
    <h1 class="title">CUBY</h1>
    <button class="start-btn" id="startButton">START AI</button>
  </main>

  <section class="bottom-bar">
    <div class="caption" id="responseArea">Ready.</div>
    <div class="composer">
      <input id="textInput" placeholder="Type command" autocomplete="off">
      <button id="sendButton" type="button">Send</button>
    </div>
  </section>

  <script>
    let latestSeq = 0;
    let speakingTimer = null;

    function toggleMenu() {
      document.getElementById('optionsMenu').classList.toggle('show');
    }

    function toggleMenuByImage(event) {
      event.stopPropagation();
      toggleMenu();
    }

    window.onclick = function(event) {
      if (!event.target.closest('.menu')) {
        document.getElementById('optionsMenu').classList.remove('show');
      }
    };

    function setMood(className) {
      document.body.classList.remove('user-light', 'rain-light', 'heat-light', 'clear-light', 'alert-light');
      document.body.classList.add(className || 'clear-light');
    }

    function pulseSpeaking() {
      document.body.classList.add('speaking');
      clearTimeout(speakingTimer);
      speakingTimer = setTimeout(() => document.body.classList.remove('speaking'), 4200);
    }

    function moodFromWeather(payload) {
      if (!payload) return 'clear-light';
      if (payload.alert_level === 'warning') return 'alert-light';
      if (payload.rain_expected) return 'rain-light';
      if (payload.heat_alert) return 'heat-light';
      return 'clear-light';
    }

    function moodFromText(text) {
      const value = String(text || '').toLowerCase();
      if (value.includes('heavy rain') || value.includes('thunderstorm') || value.includes('warning')) return 'alert-light';
      if (value.includes('rain') || value.includes('umbrella')) return 'rain-light';
      if (value.includes('hot') || value.includes('heat')) return 'heat-light';
      return 'clear-light';
    }

    function showText(text, mood, speaking) {
      const responseArea = document.getElementById('responseArea');
      responseArea.textContent = text || 'Ready.';
      setMood(mood || moodFromText(text));
      if (speaking) pulseSpeaking();
    }

    function compactUpdateText(value) {
      const text = String(value || '').replace(/\s+/g, ' ').trim();
      if (text.length <= 118) return text;
      return `${text.slice(0, 115).trim()}...`;
    }

    function renderDailyUpdates(payload) {
      const panel = document.getElementById('updatesPanel');
      const list = document.getElementById('updatesList');
      const sections = payload && Array.isArray(payload.sections) ? payload.sections : [];
      list.textContent = '';

      if (!sections.length) {
        panel.hidden = true;
        document.body.classList.remove('has-updates');
        return;
      }

      sections.slice(0, 6).forEach(section => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        title.textContent = section.title || 'Update';
        const text = document.createElement('span');
        text.textContent = compactUpdateText(section.text);
        item.append(title, text);
        list.appendChild(item);
      });

      panel.hidden = false;
      document.body.classList.add('has-updates');
    }

    function handleEvent(event) {
      latestSeq = Math.max(latestSeq, event.seq || 0);
      if (event.kind === 'user') {
        showText(event.text, 'user-light', false);
        return;
      }
      if (event.kind === 'weather') {
        showText(event.text, moodFromWeather(event.payload), true);
        return;
      }
      if (event.kind === 'briefing') {
        const weather = event.payload && event.payload.weather && event.payload.weather.data;
        renderDailyUpdates(event.payload);
        showText(event.text, weather ? moodFromWeather(weather) : moodFromText(event.text), true);
        return;
      }
      if (event.kind === 'assistant') {
        showText(event.text, moodFromText(event.text), true);
      }
    }

    async function pollEvents() {
      try {
        const res = await fetch(`/api/ai/events?since=${latestSeq}`);
        const data = await res.json();
        const payload = data.data || {};
        latestSeq = payload.latest_seq || latestSeq;
        (payload.events || []).forEach(handleEvent);
        document.getElementById('runState').textContent = payload.running ? 'Listening' : 'Standby';
      } catch (err) {
        document.getElementById('runState').textContent = 'Sync waiting';
      }
    }

    window.sendTypedCommand = async function sendTypedCommand() {
      const input = document.getElementById('textInput');
      const command = input.value.trim();
      if (!command) return;
      showText(command, 'user-light', false);
      try {
        const res = await fetch('/api/ai/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        });
        const data = await res.json();
        const response = data && data.data && data.data.response
          ? data.data.response
          : data.message || 'No response';
        showText(response, moodFromText(response), true);
        input.value = '';
        setTimeout(pollEvents, 250);
      } catch (err) {
        showText('Error sending command', 'alert-light', true);
      }
    };

    document.getElementById('sendButton').addEventListener('click', window.sendTypedCommand);
    document.getElementById('textInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        window.sendTypedCommand();
      }
    });

    document.getElementById('startButton').addEventListener('click', async () => {
      try {
        const res = await fetch('/start_ai');
        const data = await res.json();
        showText(data.message || 'CUBY started', 'clear-light', true);
        pollEvents();
      } catch (err) {
        showText('CUBY startup failed', 'alert-light', true);
      }
    });

    pollEvents();
    setInterval(pollEvents, 1800);
  </script>
</body>
</html>
