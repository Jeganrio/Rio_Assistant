<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBY AI</title>
  <link rel="icon" href="/static/images/logo_3.png" type="image/x-icon">
  <style>
    :root {
      --light-main: rgba(74, 194, 210, 0.38);
      --light-soft: rgba(118, 220, 176, 0.18);
      --text: #f6fbfc;
      --muted: #aebcc1;
      --panel: rgba(5, 8, 10, 0.58);
      --line: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      isolation: isolate;
      background:
        linear-gradient(120deg, rgba(2, 5, 8, 0.96), rgba(6, 10, 14, 0.88)),
        url("/static/my_bg.jpg") center / cover fixed,
        #05080a;
      transition: background-color 0.6s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0%, var(--light-soft) 48%, transparent 100%),
        linear-gradient(180deg, transparent 0%, var(--light-main) 52%, transparent 100%);
      opacity: 0.72;
      transform: scale(1.05);
      filter: blur(42px);
      z-index: 0;
      transition: opacity 0.7s ease, filter 0.7s ease, background 0.7s ease;
    }

    body.speaking::before {
      animation: speakingLight 1.2s ease-in-out infinite;
    }

    body.user-light {
      --light-main: rgba(92, 144, 255, 0.36);
      --light-soft: rgba(82, 190, 230, 0.18);
    }

    body.rain-light {
      --light-main: rgba(72, 196, 222, 0.50);
      --light-soft: rgba(92, 128, 255, 0.18);
    }

    body.heat-light {
      --light-main: rgba(246, 172, 69, 0.50);
      --light-soft: rgba(255, 105, 84, 0.20);
    }

    body.clear-light {
      --light-main: rgba(103, 217, 128, 0.36);
      --light-soft: rgba(74, 194, 210, 0.14);
    }

    body.alert-light {
      --light-main: rgba(255, 96, 76, 0.50);
      --light-soft: rgba(246, 172, 69, 0.20);
    }

    @keyframes speakingLight {
      0%, 100% { opacity: 0.48; filter: blur(48px); }
      50% { opacity: 0.92; filter: blur(30px); }
    }

    .robot-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      display: grid;
      place-items: center;
      opacity: 0.88;
      overflow: hidden;
    }

    .robot-backdrop::before {
      content: "";
      position: absolute;
      inset: 8vh 8vw 14vh;
      background:
        linear-gradient(90deg, transparent 0 48%, rgba(255,255,255,0.05) 48% 52%, transparent 52%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 56px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 56px);
      mask-image: radial-gradient(ellipse at center, black 0 56%, transparent 78%);
      opacity: 0.56;
    }

    .robot-frame {
      position: relative;
      width: min(760px, 78vw);
      height: min(760px, 72vh);
      display: grid;
      place-items: center;
    }

    .robot-frame::before,
    .robot-frame::after {
      content: "";
      position: absolute;
      top: 16%;
      width: 18%;
      height: 42%;
      border: 1px solid color-mix(in srgb, var(--light-main), transparent 35%);
      opacity: 0.42;
    }

    .robot-frame::before {
      left: 2%;
      border-right: 0;
      transform: skewY(-8deg);
    }

    .robot-frame::after {
      right: 2%;
      border-left: 0;
      transform: skewY(8deg);
    }

    .robot-head {
      position: relative;
      width: 68%;
      aspect-ratio: 1.22;
      border: 2px solid color-mix(in srgb, var(--light-main), white 16%);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.02)),
        linear-gradient(90deg, transparent 0 12%, rgba(255,255,255,0.04) 12% 13%, transparent 13% 87%, rgba(255,255,255,0.04) 87% 88%, transparent 88%);
      box-shadow:
        0 0 34px color-mix(in srgb, var(--light-main), transparent 56%),
        inset 0 0 28px rgba(255,255,255,0.06);
      transform: translateY(-32px);
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }

    .robot-arm {
      position: absolute;
      top: 48%;
      width: 34%;
      height: 22%;
      opacity: 0.58;
      transition: transform 0.7s ease, opacity 0.7s ease;
    }

    .robot-arm.left {
      left: -2%;
      transform: rotate(14deg);
      transform-origin: right center;
    }

    .robot-arm.right {
      right: -2%;
      transform: rotate(-14deg) scaleX(-1);
      transform-origin: right center;
    }

    .upper-arm,
    .forearm {
      position: absolute;
      height: 12px;
      border: 1px solid color-mix(in srgb, var(--light-main), white 14%);
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--light-main), transparent 18%), transparent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 34%);
    }

    .upper-arm {
      top: 18%;
      right: 20%;
      width: 58%;
      transform: rotate(-20deg);
    }

    .forearm {
      top: 42%;
      left: 16%;
      width: 56%;
      transform: rotate(22deg);
    }

    .joint,
    .claw {
      position: absolute;
      border: 1px solid color-mix(in srgb, var(--light-main), white 18%);
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 28%);
    }

    .joint {
      top: 31%;
      left: 56%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    .claw {
      top: 54%;
      left: 6%;
      width: 34px;
      height: 22px;
      border-left: 0;
      border-radius: 0 999px 999px 0;
    }

    body.has-updates .robot-arm.left {
      opacity: 0.82;
      transform: rotate(30deg) translateY(-18px);
    }

    body.has-updates .robot-arm.right {
      opacity: 0.86;
      transform: rotate(-32deg) scaleX(-1) translateY(-22px);
    }

    body.speaking .robot-arm {
      opacity: 0.9;
      animation: armPulse 1.4s ease-in-out infinite;
    }

    .robot-head::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 2px;
      height: 52px;
      background: color-mix(in srgb, var(--light-main), white 12%);
      box-shadow: 0 0 16px var(--light-main);
      transform: translateX(-50%);
    }

    .robot-head::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 48px);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--light-main), white 12%);
      box-shadow: 0 0 24px var(--light-main);
      transform: translateX(-50%);
    }

    .robot-eye {
      position: absolute;
      top: 33%;
      width: 18%;
      height: 12%;
      border-radius: 999px;
      background: color-mix(in srgb, var(--light-main), white 18%);
      box-shadow: 0 0 22px var(--light-main);
      opacity: 0.88;
    }

    .robot-eye.left { left: 22%; }
    .robot-eye.right { right: 22%; }

    .robot-mouth {
      position: absolute;
      left: 21%;
      right: 21%;
      bottom: 26%;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-top: 1px solid rgba(255,255,255,0.12);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .wave-bar {
      width: 5px;
      height: 16px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--light-main), white 12%);
      box-shadow: 0 0 14px var(--light-main);
      opacity: 0.76;
      transform-origin: center;
    }

    .wave-bar:nth-child(2) { height: 28px; }
    .wave-bar:nth-child(3) { height: 40px; }
    .wave-bar:nth-child(4) { height: 24px; }
    .wave-bar:nth-child(5) { height: 34px; }
    .wave-bar:nth-child(6) { height: 20px; }
    .wave-bar:nth-child(7) { height: 38px; }
    .wave-bar:nth-child(8) { height: 26px; }
    .wave-bar:nth-child(9) { height: 14px; }

    .wave-field {
      position: absolute;
      inset: 0;
      display: block;
      overflow: hidden;
    }

    .wave-stack {
      position: absolute;
      left: 0;
      right: 0;
      top: 46%;
      width: 100vw;
      display: grid;
      gap: 18px;
      opacity: 0.46;
      transform: translateY(-50%);
    }

    .wave-stack.right {
      top: 61%;
      transform: translateY(-50%) scaleX(-1);
      opacity: 0.34;
    }

    .wave-line {
      width: 100vw;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--light-main), transparent);
      box-shadow: 0 0 16px var(--light-main);
      transform-origin: center;
    }

    .wave-line:nth-child(1) { opacity: 0.35; }
    .wave-line:nth-child(2) { opacity: 0.64; }
    .wave-line:nth-child(3) { opacity: 0.9; }
    .wave-line:nth-child(4) { opacity: 0.58; }
    .wave-line:nth-child(5) { opacity: 0.32; }

    body.speaking .robot-head {
      box-shadow:
        0 0 54px color-mix(in srgb, var(--light-main), transparent 30%),
        inset 0 0 34px rgba(255,255,255,0.08);
    }

    body.speaking .wave-bar {
      animation: voiceBars 0.76s ease-in-out infinite;
    }

    body.speaking .wave-bar:nth-child(2n) {
      animation-delay: 0.12s;
    }

    body.speaking .wave-bar:nth-child(3n) {
      animation-delay: 0.22s;
    }

    body.speaking .wave-line {
      animation: sideWave 1.1s ease-in-out infinite;
    }

    body.speaking .wave-line:nth-child(2n) {
      animation-delay: 0.16s;
    }

    @keyframes voiceBars {
      0%, 100% { transform: scaleY(0.56); opacity: 0.48; }
      50% { transform: scaleY(1.35); opacity: 1; }
    }

    @keyframes sideWave {
      0%, 100% { transform: scaleX(0.72); opacity: 0.34; }
      50% { transform: scaleX(1.08); opacity: 0.92; }
    }

    @keyframes armPulse {
      0%, 100% { filter: drop-shadow(0 0 4px var(--light-main)); }
      50% { filter: drop-shadow(0 0 18px var(--light-main)); }
    }

    .menu {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 4;
    }

    .menu-toggle {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.32);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .toggle_img {
      width: 28px;
      height: 28px;
    }

    .options {
      display: none;
      position: absolute;
      top: 52px;
      left: 0;
      min-width: 150px;
      margin: 0;
      padding: 6px;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(5, 8, 10, 0.88);
    }

    .options.show { display: block; }

    .options a {
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }

    .options a:hover { background: rgba(255, 255, 255, 0.08); }

    .center {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 22px;
      text-align: center;
      padding: 24px;
    }

    .title {
      margin: 0;
      font-size: clamp(72px, 16vw, 180px);
      line-height: 0.86;
      font-weight: 900;
      letter-spacing: 0;
      color: rgba(246, 251, 252, 0.94);
      text-shadow: 0 0 26px rgba(100, 220, 230, 0.32);
      transition: text-shadow 0.5s ease, transform 0.5s ease;
    }

    body.speaking .title {
      transform: scale(1.018);
      text-shadow: 0 0 42px var(--light-main);
    }

    .start-btn {
      min-width: 180px;
      height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .start-btn:hover { background: rgba(255, 255, 255, 0.14); }

    .bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 3;
      width: min(1120px, calc(100vw - 32px));
      transform: translateX(-50%);
    }

    .caption {
      min-height: 72px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      color: var(--text);
      line-height: 1.45;
      font-size: clamp(16px, 1.25vw, 20px);
      overflow-wrap: anywhere;
    }

    .browser-action {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }

    .browser-action[hidden] { display: none; }

    .browser-action a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid color-mix(in srgb, var(--light-main), white 18%);
      border-radius: 8px;
      background: color-mix(in srgb, var(--light-main), transparent 72%);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 68%);
    }

    .mail-flow {
      margin-top: 10px;
      border: 1px solid color-mix(in srgb, var(--light-main), white 16%);
      border-radius: 8px;
      background: rgba(4, 8, 10, 0.76);
      box-shadow: 0 0 28px color-mix(in srgb, var(--light-main), transparent 72%);
      backdrop-filter: blur(16px);
      overflow: hidden;
      text-align: left;
    }

    .mail-flow[hidden] { display: none; }

    .mail-flow-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .mail-flow-header button {
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .mail-flow-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: rgba(255,255,255,0.08);
    }

    .mail-flow-field {
      min-width: 0;
      padding: 12px 14px;
      background: rgba(0,0,0,0.2);
    }

    .mail-flow-field strong {
      display: block;
      margin-bottom: 5px;
      color: color-mix(in srgb, var(--light-main), white 30%);
      font-size: 11px;
      text-transform: uppercase;
    }

    .mail-flow-field span {
      display: block;
      min-height: 22px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .mail-flow-step {
      padding: 11px 14px 13px;
      color: color-mix(in srgb, var(--text), var(--muted) 28%);
      font-size: 14px;
      line-height: 1.35;
    }

    .composer {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 82px;
      gap: 8px;
    }

    #textInput {
      height: 46px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.34);
      color: var(--text);
      font-size: 15px;
      padding: 0 12px;
      outline: none;
      backdrop-filter: blur(12px);
    }

    #textInput:focus {
      border-color: color-mix(in srgb, var(--light-main), white 22%);
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 44%);
    }

    #sendButton {
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .updates-panel {
      position: absolute;
      inset: -8% -52% 0;
      z-index: 5;
      pointer-events: none;
    }

    .updates-panel[hidden] { display: none; }

    .updates-title { display: none; }

    .updates-list {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .updates-list li {
      position: absolute;
      width: clamp(250px, 17vw, 330px);
      height: clamp(128px, 12vh, 158px);
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      background: rgba(5, 8, 10, 0.66);
      backdrop-filter: blur(14px);
      color: var(--text);
      font-size: clamp(16px, 1.05vw, 18px);
      line-height: 1.36;
      overflow-wrap: anywhere;
      overflow: visible;
      box-shadow: 0 0 22px color-mix(in srgb, var(--light-main), transparent 66%);
      animation: updateFloat 2.8s ease-in-out infinite;
      transition:
        left 0.72s ease,
        right 0.72s ease,
        top 0.72s ease,
        transform 0.72s ease,
        opacity 0.72s ease,
        border-color 0.72s ease,
        box-shadow 0.72s ease;
    }

    .updates-list li::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 100%;
      width: clamp(90px, 10vw, 180px);
      height: 10px;
      border: 1px solid color-mix(in srgb, var(--light-main), white 12%);
      border-radius: 999px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--light-main), transparent 28%), transparent);
      box-shadow: 0 0 18px color-mix(in srgb, var(--light-main), transparent 42%);
      opacity: 0.46;
      transform: translateY(-50%) rotate(-8deg);
      transform-origin: left center;
    }

    .updates-list li::after {
      content: "";
      position: absolute;
      top: calc(50% - 9px);
      left: calc(100% - 1px);
      width: 24px;
      height: 18px;
      border: 1px solid color-mix(in srgb, var(--light-main), white 16%);
      border-left: 0;
      border-radius: 0 999px 999px 0;
      opacity: 0.54;
    }

    .updates-list li:nth-child(2n)::before {
      left: auto;
      right: 100%;
      background: linear-gradient(270deg, color-mix(in srgb, var(--light-main), transparent 28%), transparent);
      transform: translateY(-50%) rotate(8deg);
      transform-origin: right center;
    }

    .updates-list li:nth-child(2n)::after {
      left: auto;
      right: calc(100% - 1px);
      border-left: 1px solid color-mix(in srgb, var(--light-main), white 16%);
      border-right: 0;
      border-radius: 999px 0 0 999px;
    }

    .updates-list li:nth-child(1) { left: 0; top: 8%; }
    .updates-list li:nth-child(2) { right: 0; top: 8%; }
    .updates-list li:nth-child(3) { left: 0; top: 38%; }
    .updates-list li:nth-child(4) { right: 0; top: 38%; }
    .updates-list li:nth-child(5) { left: 5%; top: 65%; }
    .updates-list li:nth-child(6) { right: 5%; top: 65%; }

    .updates-list li.is-active {
      left: 50% !important;
      right: auto !important;
      top: 3% !important;
      width: min(430px, calc(100vw - 42px));
      height: auto;
      min-height: 136px;
      z-index: 12;
      opacity: 1;
      border-color: color-mix(in srgb, var(--light-main), white 36%);
      box-shadow:
        0 0 44px color-mix(in srgb, var(--light-main), transparent 36%),
        inset 0 0 22px rgba(255,255,255,0.05);
      animation: none;
      transform: translate(-50%, -4px) scale(1.08);
    }

    .updates-list li.is-active::before,
    .updates-list li.is-active::after {
      opacity: 0.95;
      animation: presentHand 0.72s ease both;
    }

    .updates-list li:nth-child(2n) {
      animation-delay: 0.3s;
    }

    .updates-list strong {
      display: block;
      margin-bottom: 6px;
      color: color-mix(in srgb, var(--light-main), white 30%);
      font-size: 13px;
      text-transform: uppercase;
    }

    .updates-list span {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow: hidden;
    }

    .updates-list li.is-active span {
      -webkit-line-clamp: 7;
    }

    @keyframes updateFloat {
      0%, 100% { transform: translateY(0); opacity: 0.76; }
      50% { transform: translateY(-5px); opacity: 1; }
    }

    @keyframes presentHand {
      0% { filter: brightness(0.85); }
      100% { filter: brightness(1.4); }
    }

    body.briefing-focus .robot-arm.left {
      transform: rotate(42deg) translate(28px, -42px);
      opacity: 1;
    }

    body.briefing-focus .robot-arm.right {
      transform: rotate(-42deg) scaleX(-1) translate(28px, -42px);
      opacity: 1;
    }

    .status {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 3;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      .caption {
        min-height: 76px;
      }
      .mail-flow-grid {
        grid-template-columns: 1fr;
      }
      .updates-panel {
        inset: 0 -6% 0;
      }
      .updates-list li {
        width: min(220px, 42vw);
        height: auto;
        min-height: 68px;
        max-height: 76px;
        padding: 10px 11px;

      .updates-list strong { font-size: 11.5px; }
      .updates-list span { -webkit-line-clamp: 2; }
      .updates-list li:nth-child(1) { left: 7%; top: 4%; }
      .updates-list li:nth-child(2) { right: 7%; top: 4%; }

      .updates-list li.is-active {

      .updates-list li.is-active span { -webkit-line-clamp: 7; }
      .robot-arm {
        opacity: 0.38;
      }
    }
  </style>
</head>

  <main class="center">

  <section class="bottom-bar">

  <script>
    let latestSeq = 0;
    let speakingTimer = null;
    let browserRecognition = null;
    let browserMicActive = false;
    let browserSpeechLang = localStorage.getItem('cubySpeechLang') || 'en-IN';
    let browserVoiceGender = localStorage.getItem('cubyVoiceGender') || 'female';
    let browserVoices = [];
    let browserNoSpeechCount = 0;
    let browserPausedForSpeech = false;
    let briefingSections = [];
    let activeBriefingIndex = -1;
    let briefingFocusTimer = null;
    let mailFlowState = null;
    const wakeWords = [
      'cuby', 'cupy', 'cuppy', 'kuby', 'kubi', 'cubie', 'cubi',
      'cubby', 'cubey', 'quby', 'qby', 'cooby', 'coby',
      'kavi', 'gopi', 'gobi', 'goby', 'gooby', 'cube'
    ];
    const wakeWordsWithCopy = [...wakeWords, 'copy'];

    function toggleMenu() {
      document.getElementById('optionsMenu').classList.toggle('show');
    }

    function toggleMenuByImage(event) {
      event.stopPropagation();
      toggleMenu();
    }

    window.onclick = function(event) {
      if (!event.target.closest('.menu')) {
        document.getElementById('optionsMenu').classList.remove('show');
      }
    };

    function setMood(className) {
      document.body.classList.remove('user-light', 'rain-light', 'heat-light', 'clear-light', 'alert-light');
      document.body.classList.add(className || 'clear-light');
    }

    function pulseSpeaking(duration = 4200) {
      document.body.classList.add('speaking');
      clearTimeout(speakingTimer);
      speakingTimer = setTimeout(() => document.body.classList.remove('speaking'), duration);
    }

    function moodFromWeather(payload) {
      if (!payload) return 'clear-light';
      if (payload.alert_level === 'warning') return 'alert-light';
      if (payload.rain_expected) return 'rain-light';
      if (payload.heat_alert) return 'heat-light';
      return 'clear-light';
    }

    function moodFromText(text) {
      const value = String(text || '').toLowerCase();
      if (value.includes('heavy rain') || value.includes('thunderstorm') || value.includes('warning')) return 'alert-light';
      if (value.includes('rain') || value.includes('umbrella')) return 'rain-light';
      if (value.includes('hot') || value.includes('heat')) return 'heat-light';
      return 'clear-light';
    }

    function showText(text, mood, speaking) {
      const responseArea = document.getElementById('responseArea');
      responseArea.textContent = text || 'Ready.';
      hideBrowserActionPrompt();
      setMood(mood || moodFromText(text));
      if (speaking) pulseSpeaking();
    }

    function isLiveServer() {
      const host = window.location.hostname;
      return host && !['localhost', '127.0.0.1', '::1'].includes(host);
    }

    function hasTamilText(text) {
      return /[\u0B80-\u0BFF]/.test(String(text || ''));
    }

    function loadBrowserVoices() {
      if (!('speechSynthesis' in window)) return [];
      browserVoices = window.speechSynthesis.getVoices() || [];
      return browserVoices;
    }

    function restartRecognitionForLanguage() {
      if (!browserMicActive || !browserRecognition) return;
      try {
        browserRecognition.stop();
      } catch (err) {
        // The onend handler will rebuild listening when the browser allows it.
      }
    }

    function restartBrowserRecognitionSoon(delay = 650) {
      if (!browserMicActive || !browserRecognition || browserPausedForSpeech) return;
      window.setTimeout(() => {
        if (!browserMicActive || !browserRecognition || browserPausedForSpeech) return;
        try {
          browserRecognition.lang = browserSpeechLang;
          browserRecognition.start();
        } catch (err) {
          browserMicActive = false;
          document.getElementById('startButton').textContent = 'START MIC';
          document.getElementById('runState').textContent = 'Standby';
        }
      }, delay);
    }

    function normalizeLiveCommand(command) {
      let value = String(command || '').replace(/\s+/g, ' ').trim();
      const lower = value.toLowerCase();
      const wakePattern = wakeWords.join('|');
      const wakePatternWithCopy = wakeWordsWithCopy.join('|');
      if (
        new RegExp(`^(?:${wakePattern})$`, 'i').test(lower) ||
        new RegExp(`^(?:hey|hi|ok|okay|hello)\\s+(?:${wakePatternWithCopy})$`, 'i').test(lower)
      ) {
        return 'hey cuby';
      }
      value = value.replace(new RegExp(`\\b(hey|hi|ok|okay|hello)\\s+(?:${wakePatternWithCopy})\\b`, 'ig'), 'hey cuby');
      value = value.replace(/\bmail voice\b/ig, 'male voice');
      value = value.replace(/\bmain voice\b/ig, 'male voice');
      value = value.replace(/\bp ?mail voice\b/ig, 'female voice');
      return value;
    }

    function chooseSpeechTranscript(result) {
      const alternatives = [];
      for (let i = 0; i < result.length; i += 1) {
        alternatives.push(result[i].transcript || '');
      }
      return (
        alternatives.find(text => normalizeLiveCommand(text).toLowerCase() === 'hey cuby') ||
        alternatives[0] ||
        ''
      );
    }

    function updateBrowserLanguageFromText(text) {
      const value = String(text || '').toLowerCase();
      const previousLang = browserSpeechLang;
      if (
        value.includes('switch to tamil') ||
        value.includes('switch tamil') ||
        value.includes('speak tamil') ||
        value.includes('tamil language') ||
        value.includes('தமிழ்') ||
        hasTamilText(text)
      ) {
        browserSpeechLang = 'ta-IN';
      } else if (
        value.includes('switch to english') ||
        value.includes('switch english') ||
        value.includes('speak english') ||
        value.includes('english language') ||
        value.includes('ஆங்கில') ||
        value.includes('இங்கிலீஷ்') ||
        value.includes('இங்கிலிஷ்')
      ) {
        browserSpeechLang = 'en-IN';
      }
      localStorage.setItem('cubySpeechLang', browserSpeechLang);
      if (previousLang !== browserSpeechLang) restartRecognitionForLanguage();
    }

    function updateBrowserVoiceGenderFromText(text) {
      const value = String(text || '').toLowerCase();
      if (/\bfemale\b/.test(value) || value.includes('பெண்') || value.includes('ஃபீமேல்') || value.includes('பீமேல்')) {
        browserVoiceGender = 'female';
      } else if (/\bmale\b/.test(value) || value.includes('ஆண்') || value.includes('மேல் வாய்ஸ்') || value.includes('மேல் குரல்')) {
        browserVoiceGender = 'male';
      }
      localStorage.setItem('cubyVoiceGender', browserVoiceGender);
    }

    function selectBrowserVoice(lang, gender) {
      const voices = browserVoices.length ? browserVoices : loadBrowserVoices();
      if (!voices.length) return null;
      const langPrefix = String(lang || 'en-IN').split('-')[0].toLowerCase();
      const candidates = voices.filter(voice => String(voice.lang || '').toLowerCase().startsWith(langPrefix));
      const pool = candidates.length ? candidates : voices;
      const maleHints = ['male', 'prabhat', 'valluvar', 'ravi', 'david', 'mark', 'george', 'guy'];
      const femaleHints = ['female', 'neerja', 'pallavi', 'zira', 'heera', 'aria', 'jenny', 'susan', 'woman'];
      const hints = gender === 'male' ? maleHints : femaleHints;
      return (
        pool.find(voice => hints.some(hint => `${voice.name} ${voice.voiceURI}`.toLowerCase().includes(hint))) ||
        pool.find(voice => String(voice.lang || '').toLowerCase() === String(lang || '').toLowerCase()) ||
        pool[0] ||
        null
      );
    }

    function speakInBrowser(text) {
      if (!isLiveServer() || !('speechSynthesis' in window) || !text) return;
      try {
        const shouldPauseRecognition = browserMicActive && browserRecognition;
        const resumeRecognition = () => {
          if (!shouldPauseRecognition) return;
          browserPausedForSpeech = false;
          restartBrowserRecognitionSoon(450);
        };
        if (shouldPauseRecognition) {
          browserPausedForSpeech = true;
          try {
            browserRecognition.stop();
          } catch (err) {
            // Recognition may already be stopped between browser callbacks.
          }
        }
        const utterance = new SpeechSynthesisUtterance(String(text).slice(0, 420));
        const lang = hasTamilText(text) || browserSpeechLang === 'ta-IN' ? 'ta-IN' : 'en-IN';
        utterance.lang = lang;
        utterance.voice = selectBrowserVoice(lang, browserVoiceGender);
        utterance.rate = browserVoiceGender === 'male' ? 0.92 : 0.98;
        utterance.pitch = browserVoiceGender === 'male' ? 0.78 : 1.08;
        utterance.onend = resumeRecognition;
        utterance.onerror = resumeRecognition;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        window.setTimeout(resumeRecognition, Math.min(9000, Math.max(2500, String(text).length * 45)));
      } catch (err) {
        // Browser speech is a convenience on cloud; text response remains primary.
        browserPausedForSpeech = false;
      }
    }

    function speakUiPrompt(text) {
      if (!('speechSynthesis' in window) || !text) {
        pulseSpeaking();
        return;
      }
      try {
        const shouldPauseRecognition = browserMicActive && browserRecognition;
        const resumeRecognition = () => {
          if (!shouldPauseRecognition) return;
          browserPausedForSpeech = false;
          restartBrowserRecognitionSoon(450);
        };
        if (shouldPauseRecognition) {
          browserPausedForSpeech = true;
          try {
            browserRecognition.stop();
          } catch (err) {
            // Recognition may already be between browser callbacks.
          }
        }
        const utterance = new SpeechSynthesisUtterance(String(text).slice(0, 360));
        const lang = hasTamilText(text) || browserSpeechLang === 'ta-IN' ? 'ta-IN' : 'en-IN';
        utterance.lang = lang;
        utterance.voice = selectBrowserVoice(lang, browserVoiceGender);
        utterance.rate = browserVoiceGender === 'male' ? 0.92 : 0.98;
        utterance.pitch = browserVoiceGender === 'male' ? 0.78 : 1.08;
        utterance.onend = resumeRecognition;
        utterance.onerror = resumeRecognition;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
        pulseSpeaking(Math.min(7200, Math.max(2600, String(text).length * 42)));
        window.setTimeout(resumeRecognition, Math.min(7200, Math.max(2500, String(text).length * 45)));
      } catch (err) {
        browserPausedForSpeech = false;
        pulseSpeaking();
      }
    }

    function compactUpdateText(value) {
      const text = String(value || '').replace(/\s+/g, ' ').trim();
      if (text.length <= 118) return text;
      return `${text.slice(0, 115).trim()}...`;
    }

    function clearBriefingFocus() {
      activeBriefingIndex = -1;
      document.body.classList.remove('briefing-focus');
      document.querySelectorAll('#updatesList li.is-active').forEach(item => item.classList.remove('is-active'));
      clearTimeout(briefingFocusTimer);
    }

    function setActiveBriefingCard(index) {
      const items = Array.from(document.querySelectorAll('#updatesList li'));
      if (!items.length || index < 0 || index >= items.length) return false;
      items.forEach(item => item.classList.remove('is-active'));
      items[index].classList.add('is-active');
      activeBriefingIndex = index;
      document.body.classList.add('briefing-focus');
      clearTimeout(briefingFocusTimer);
      briefingFocusTimer = setTimeout(() => {
        if (activeBriefingIndex === index) {
          clearBriefingFocus();
        }
      }, 5600);
      return true;
    }

    function normalizeBriefingText(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9\u0B80-\u0BFF]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function focusBriefingFromText(text) {
      if (!briefingSections.length) return false;
      const value = normalizeBriefingText(text);
      if (!value || value === 'daily briefing' || value.includes('here is your daily briefing')) return false;

      const directIndex = briefingSections.findIndex(section => {
        const title = normalizeBriefingText(section.title);
        return title && (value.startsWith(title) || value.includes(`${title} `));
      });
      if (directIndex >= 0) {
        return setActiveBriefingCard(directIndex);
      }

      return setActiveBriefingCard((activeBriefingIndex + 1) % briefingSections.length);
    }

    function renderDailyUpdates(payload) {
      const panel = document.getElementById('updatesPanel');
      const list = document.getElementById('updatesList');
      const sections = payload && Array.isArray(payload.sections) ? payload.sections : [];
      list.textContent = '';
      clearBriefingFocus();

      if (!sections.length) {
        panel.hidden = true;
        document.body.classList.remove('has-updates');
        briefingSections = [];
        return;
      }

      briefingSections = sections.slice(0, 6);
      briefingSections.forEach((section, index) => {
        const item = document.createElement('li');
        item.dataset.index = String(index);
        const title = document.createElement('strong');
        title.textContent = section.title || 'Update';
        const text = document.createElement('span');
        text.textContent = compactUpdateText(section.text);
        item.append(title, text);
        list.appendChild(item);
      });

      panel.hidden = false;
      document.body.classList.add('has-updates');
    }

    function handleEvent(event) {
      latestSeq = Math.max(latestSeq, event.seq || 0);
      if (event.kind === 'user') {
        showText(event.text, 'user-light', false);
        return;
      }
      if (event.kind === 'weather') {
        showText(event.text, moodFromWeather(event.payload), true);
        return;
      }
      if (event.kind === 'briefing') {
        const weather = event.payload && event.payload.weather && event.payload.weather.data;
        renderDailyUpdates(event.payload);
        showText(event.text, weather ? moodFromWeather(weather) : moodFromText(event.text), true);
        return;
      }
      if (event.kind === 'assistant') {
        focusBriefingFromText(event.text);
        showText(event.text, moodFromText(event.text), true);
      }
    }

    async function pollEvents() {
      try {
        const res = await fetch(`/api/ai/events?since=${latestSeq}`);
        const data = await res.json();
        const payload = data.data || {};
        latestSeq = payload.latest_seq || latestSeq;
        (payload.events || []).forEach(handleEvent);
        if (browserMicActive) {
          document.getElementById('runState').textContent = browserSpeechLang === 'ta-IN' ? 'Listening Tamil' : 'Listening';
        } else {
          document.getElementById('runState').textContent = payload.running ? 'Listening' : 'Standby';
        }
      } catch (err) {
        document.getElementById('runState').textContent = 'Sync waiting';
      }
    }

    function assistantResponseFromApi(data, command) {
      const payload = data && data.data ? data.data : {};
      if (payload.response) return payload.response;
      const message = data && data.message ? data.message : '';
      if (message === 'Command processed with Google search' || message === 'Search fallback used') {
        const query = payload.command || command || 'that';
        return `I did not find a direct CUBY action for ${query}.`;
      }
      return message || 'No response';
    }

    function hideBrowserActionPrompt() {
      const actionBox = document.getElementById('browserAction');
      const actionLink = document.getElementById('browserActionLink');
      if (!actionBox || !actionLink) return;
      actionBox.hidden = true;
      actionLink.removeAttribute('href');
      actionLink.textContent = 'Open in new tab';
    }

    function showBrowserActionPrompt(action) {
      const actionBox = document.getElementById('browserAction');
      const actionLink = document.getElementById('browserActionLink');
      if (!actionBox || !actionLink || !action || !action.url) return;
      actionLink.href = action.url;
      actionLink.target = action.target || '_blank';
      actionLink.rel = 'noopener noreferrer';
      actionLink.textContent = action.label || 'Open in new tab';
      actionBox.hidden = false;
    }

    function performBrowserAction(action) {
      if (!action || action.type !== 'open_url' || !action.url) return;
      let opened = null;
      try {
        opened = window.open(action.url, action.target || '_blank');
        if (opened) opened.opener = null;
      } catch (err) {
        opened = null;
      }
      if (!opened) {
        showBrowserActionPrompt(action);
      }
    }

    function normalizeSpokenEmailAddress(value) {
      let text = String(value || '').toLowerCase();
      text = text.replace(/\bg\s*mail\b/g, 'gmail');
      text = text.replace(/\b(dot|period|full stop)\b/g, '.');
      text = text.replace(/\s*\.\s*/g, '.');
      text = text.replace(/\b(underscore|under score)\b/g, '_');
      text = text.replace(/\b(dash|hyphen|minus)\b/g, '-');
      text = text.replace(/\b(at|add|ad)\b/g, '@');
      text = text.replace(/\b(r|are|our)\s+gmail\.com\b/g, '@gmail.com');
      text = text.replace(/\bgmail\.com\b/g, '@gmail.com');
      text = text.replace(/@@+/g, '@');
      const compact = text.replace(/\s+/g, '');
      const match = compact.match(/[a-z0-9._%+\-]+@[a-z0-9.\-]+\.(?:com|in|org|net|edu|co\.in)/i);
      return match ? match[0].replace('@@', '@') : '';
    }

    function cleanMailStepText(value, step) {
      let text = String(value || '').replace(/\s+/g, ' ').trim();
      if (step === 'subject') {
        text = text.replace(/^(subject|title|mail title|email title)\s*(is|:)?\s*/i, '');
      } else if (step === 'body') {
        text = text.replace(/^(body|content|message|mail body|email body)\s*(is|:)?\s*/i, '');
      }
      return text.trim();
    }

    function extractMailPieces(command) {
      const value = String(command || '').replace(/\s+/g, ' ').trim();
      const subjectMatch = value.match(/\b(?:subject|title)\s+(.+?)(?:\s+(?:body|content|message)\s+|$)/i);
      const bodyMatch = value.match(/\b(?:body|content|message)\s+(.+)$/i);
      return {
        to: normalizeSpokenEmailAddress(value),
        subject: subjectMatch ? cleanMailStepText(subjectMatch[1], 'subject') : '',
        body: bodyMatch ? cleanMailStepText(bodyMatch[1], 'body') : ''
      };
    }

    function isMailComposeRequest(command) {
      const value = String(command || '').toLowerCase();
      return (
        /\b(send|compose|write)\b/.test(value) &&
        /\b(gmail|mail|email)\b/.test(value)
      ) || /\b(mail|email)\s+to\b/.test(value);
    }

    function updateMailFlowUi(stepText = '') {
      const panel = document.getElementById('mailFlow');
      const input = document.getElementById('textInput');
      const sendButton = document.getElementById('sendButton');
      if (!mailFlowState) {
        panel.hidden = true;
        input.placeholder = 'Type command';
        sendButton.textContent = 'Send';
        return;
      }
      panel.hidden = false;
      document.getElementById('mailTo').textContent = mailFlowState.to || 'Waiting for recipient';
      document.getElementById('mailSubject').textContent = mailFlowState.subject || 'Waiting for subject';
      document.getElementById('mailBody').textContent = mailFlowState.body || 'Waiting for message';
      document.getElementById('mailStep').textContent = stepText || mailFlowState.prompt || '';
      if (mailFlowState.step === 'to') {
        input.placeholder = 'Recipient Gmail address';
      } else if (mailFlowState.step === 'subject') {
        input.placeholder = 'Mail subject';
      } else if (mailFlowState.step === 'body') {
        input.placeholder = 'Mail content';
      } else {
        input.placeholder = 'Type command';
      }
      sendButton.textContent = mailFlowState.step === 'sending' ? 'Sending' : 'Next';
    }

    function promptMailFlow(message) {
      if (!mailFlowState) return;
      mailFlowState.prompt = message;
      updateMailFlowUi(message);
      showText(message, 'clear-light', true);
      speakUiPrompt(message);
    }

    function cancelMailFlow(message = 'Gmail composer cancelled.') {
      mailFlowState = null;
      updateMailFlowUi();
      showText(message, 'clear-light', true);
      speakUiPrompt(message);
    }

    function nextMailPrompt() {
      if (!mailFlowState.to) {
        mailFlowState.step = 'to';
        promptMailFlow('Who should I send this Gmail to? Say or type the full Gmail address.');
        return;
      }
      if (!mailFlowState.subject) {
        mailFlowState.step = 'subject';
        promptMailFlow('What is the subject for this Gmail?');
        return;
      }
      if (!mailFlowState.body) {
        mailFlowState.step = 'body';
        promptMailFlow('What content should I send in the Gmail?');
        return;
      }
      submitMailFlow();
    }

    function startMailFlow(command) {
      const pieces = extractMailPieces(command);
      mailFlowState = {
        step: 'to',
        to: pieces.to || '',
        subject: pieces.subject || '',
        body: pieces.body || '',
        prompt: ''
      };
      updateMailFlowUi();
      nextMailPrompt();
    }

    async function submitMailFlow() {
      if (!mailFlowState || !mailFlowState.to || !mailFlowState.subject || !mailFlowState.body) {
        nextMailPrompt();
        return;
      }
      const command = `send mail to ${mailFlowState.to} subject ${mailFlowState.subject} body ${mailFlowState.body}`;
      mailFlowState.step = 'sending';
      updateMailFlowUi('Sending Gmail now...');
      showText('Sending Gmail now...', 'clear-light', true);
      try {
        const res = await fetch('/api/ai/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        });
        const data = await res.json();
        const response = assistantResponseFromApi(data, command);
        const browserAction = data && data.data ? data.data.browser_action : null;
        mailFlowState.step = 'sent';
        updateMailFlowUi(response);
        showText(response, moodFromText(response), true);
        updateBrowserLanguageFromText(response);
        updateBrowserVoiceGenderFromText(response);
        speakInBrowser(response);
        performBrowserAction(browserAction);
        setTimeout(() => {
          mailFlowState = null;
          updateMailFlowUi();
        }, 5200);
        setTimeout(pollEvents, 250);
      } catch (err) {
        promptMailFlow('Gmail sending failed. Please check Gmail connection and try again.');
      }
    }

    function handleMailFlowCommand(command) {
      if (!mailFlowState) return false;
      showText(command, 'user-light', false);
      const value = String(command || '').trim();
      if (/^(cancel|cancel mail|stop mail|discard)$/i.test(value)) {
        cancelMailFlow();
        return true;
      }
      if (mailFlowState.step === 'to') {
        const email = normalizeSpokenEmailAddress(value);
        if (!email) {
          promptMailFlow('I could not read the Gmail address. Please say it like name at gmail dot com.');
          return true;
        }
        mailFlowState.to = email;
      } else if (mailFlowState.step === 'subject') {
        const subject = cleanMailStepText(value, 'subject');
        if (!subject) {
          promptMailFlow('Please say the Gmail subject.');
          return true;
        }
        mailFlowState.subject = subject;
      } else if (mailFlowState.step === 'body') {
        const body = cleanMailStepText(value, 'body');
        if (!body) {
          promptMailFlow('Please say the Gmail content.');
          return true;
        }
        mailFlowState.body = body;
      }
      updateMailFlowUi();
      nextMailPrompt();
      return true;
    }

    async function sendCommand(command, options = {}) {
      command = normalizeLiveCommand(command);
      if (!command) return;
      if (!options.skipMailFlow && handleMailFlowCommand(command)) {
        if (!options.keepInput) {
          document.getElementById('textInput').value = '';
        }
        return;
      }
      if (!options.skipMailFlow && isMailComposeRequest(command)) {
        const pieces = extractMailPieces(command);
        if (!(pieces.to && pieces.subject && pieces.body)) {
          showText(command, 'user-light', false);
          startMailFlow(command);
          if (!options.keepInput) {
            document.getElementById('textInput').value = '';
          }
          return;
        }
      }
      showText(command, 'user-light', false);
      updateBrowserLanguageFromText(command);
      updateBrowserVoiceGenderFromText(command);
      try {
        const res = await fetch('/api/ai/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        });
        const data = await res.json();
        const response = assistantResponseFromApi(data, command);
        const browserAction = data && data.data ? data.data.browser_action : null;
        showText(response, moodFromText(response), true);
        updateBrowserLanguageFromText(`${command} ${response}`);
        updateBrowserVoiceGenderFromText(`${command} ${response}`);
        speakInBrowser(response);
        performBrowserAction(browserAction);
        if (!options.keepInput) {
          document.getElementById('textInput').value = '';
        }
        setTimeout(pollEvents, 250);
      } catch (err) {
        showText('Error sending command', 'alert-light', true);
        speakInBrowser('Error sending command');
      }
    }

    window.sendTypedCommand = async function sendTypedCommand() {
      const input = document.getElementById('textInput');
      await sendCommand(input.value);
    };

    function startBrowserMic() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        const message = 'Browser voice recognition is not supported here. Please use Chrome or type the command below.';
        showText(message, 'alert-light', true);
        speakInBrowser(message);
        return;
      }

      if (browserMicActive && browserRecognition) {
        browserMicActive = false;
        browserRecognition.stop();
        document.getElementById('runState').textContent = 'Standby';
        document.getElementById('startButton').textContent = 'START MIC';
        showText('Browser microphone stopped.', 'clear-light', false);
        return;
      }

      browserRecognition = new SpeechRecognition();
      browserRecognition.continuous = true;
      browserRecognition.interimResults = true;
      browserRecognition.maxAlternatives = 3;
      browserRecognition.lang = browserSpeechLang;

      browserRecognition.onstart = () => {
        browserMicActive = true;
        document.getElementById('runState').textContent = browserSpeechLang === 'ta-IN' ? 'Listening Tamil' : 'Listening';
        document.getElementById('startButton').textContent = 'STOP MIC';
        showText('Browser microphone is listening.', 'clear-light', true);
      };

      browserRecognition.onspeechstart = () => {
        document.getElementById('runState').textContent = browserSpeechLang === 'ta-IN' ? 'Hearing Tamil' : 'Hearing';
      };

      browserRecognition.onspeechend = () => {
        document.getElementById('runState').textContent = browserSpeechLang === 'ta-IN' ? 'Thinking Tamil' : 'Thinking';
      };

      browserRecognition.onresult = event => {
        let transcript = '';
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const heard = chooseSpeechTranscript(event.results[i]);
          if (event.results[i].isFinal) {
            transcript += `${heard} `;
          } else {
            interimTranscript += `${heard} `;
          }
        }
        interimTranscript = interimTranscript.trim();
        if (interimTranscript) {
          document.getElementById('runState').textContent = compactUpdateText(`Hearing: ${interimTranscript}`);
          showText(`Hearing: ${interimTranscript}`, 'user-light', false);
        }
        transcript = transcript.trim();
        if (transcript) {
          browserNoSpeechCount = 0;
          sendCommand(transcript, { fromVoice: true });
        }
      };

      browserRecognition.onerror = event => {
        const blocked = ['not-allowed', 'service-not-allowed'].includes(event.error);
        if (event.error === 'no-speech') {
          browserNoSpeechCount += 1;
          if (browserNoSpeechCount >= 3) {
            const hint = browserSpeechLang === 'ta-IN'
              ? 'No speech heard. Speak closer to the mic, or say switch to English if needed.'
              : 'No speech heard. Speak closer to the mic, or say switch to Tamil before Tamil commands.';
            showText(hint, 'alert-light', false);
            browserNoSpeechCount = 0;
          }
          document.getElementById('runState').textContent = browserSpeechLang === 'ta-IN' ? 'Listening Tamil' : 'Listening';
          return;
        }
        const message = blocked
          ? 'Please allow microphone permission in the browser address bar, then press Start AI again.'
          : `Browser microphone error: ${event.error || 'unknown'}`;
        showText(message, 'alert-light', true);
        if (blocked) {
          browserMicActive = false;
          document.getElementById('startButton').textContent = 'START MIC';
          document.getElementById('runState').textContent = 'Mic blocked';
        }
      };

      browserRecognition.onend = () => {
        if (browserMicActive && !browserPausedForSpeech) {
          restartBrowserRecognitionSoon();
        }
      };

      try {
        browserRecognition.start();
      } catch (err) {
        browserMicActive = false;
        document.getElementById('startButton').textContent = 'START MIC';
        document.getElementById('runState').textContent = 'Standby';
        showText('Could not start browser microphone. Refresh the page and try again.', 'alert-light', true);
      }
    }

    document.getElementById('sendButton').addEventListener('click', window.sendTypedCommand);
    document.getElementById('mailCancelButton').addEventListener('click', () => cancelMailFlow());
    document.getElementById('textInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        window.sendTypedCommand();
      }
    });

    document.getElementById('startButton').addEventListener('click', async () => {
      if (isLiveServer()) {
        startBrowserMic();
        return;
      }
      try {
        const res = await fetch('/start_ai');
        const data = await res.json();
        showText(data.message || 'CUBY started', 'clear-light', true);
        pollEvents();
      } catch (err) {
        showText('CUBY startup failed', 'alert-light', true);
      }
    });

    pollEvents();
    setInterval(pollEvents, 1800);

    if (isLiveServer()) {
      loadBrowserVoices();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
      }
      document.getElementById('startButton').textContent = 'START MIC';
    }
  </script>
</body>
</html>
